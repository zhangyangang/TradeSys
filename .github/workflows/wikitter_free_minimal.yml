name: Wikitter registration form probe
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect registration form
        shell: python
        run: |
          import requests,re,html
          from urllib.parse import urljoin
          s=requests.Session(); s.headers["User-Agent"]="Mozilla/5.0"
          u="https://www.wikitter.com/index.php?route=account/register"
          r=s.get(u,timeout=25)
          print("HTTP",r.status_code,"LEN",len(r.text),"FINAL",r.url)
          t=r.text
          for fm in re.finditer(r'<form([^>]*)>(.*?)</form>',t,re.I|re.S):
              attrs=fm.group(1); body=fm.group(2)
              print("FORM_ATTR",re.sub(r'\s+',' ',attrs)[:1000])
              for inp in re.finditer(r'<(?:input|select|textarea)([^>]*)>',body,re.I|re.S):
                  a=inp.group(1)
                  name=re.search(r'name=["\']([^"\']+)',a,re.I)
                  typ=re.search(r'type=["\']([^"\']+)',a,re.I)
                  val=re.search(r'value=["\']([^"\']*)',a,re.I)
                  req=("required" in a.lower())
                  print("FIELD",name.group(1) if name else None,typ.group(1) if typ else None,val.group(1) if val else None,"REQ",req)
          text=re.sub(r'<[^>]+>',' ',t)
          print("TEXT",html.unescape(re.sub(r'\s+',' ',text))[:10000])
