name: Wikitter free page minimal probe
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and parse
        shell: python
        run: |
          import requests,re,html
          from urllib.parse import urljoin
          u="https://www.wikitter.com/free"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=25)
          print("HTTP",r.status_code,"LEN",len(r.content),"ENC",r.encoding,"APP",r.apparent_encoding)
          # Decode both likely charsets
          for enc in ["utf-8","gb18030",r.apparent_encoding]:
              try:
                  t=r.content.decode(enc,errors="ignore")
              except: continue
              print("\nENCODING",enc,"TEXT_HEAD",re.sub(r"\s+"," ",re.sub("<[^>]+>"," ",t))[:1200])
              for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',t,re.I|re.S):
                  href=urljoin(r.url,html.unescape(m.group(1)))
                  label=re.sub(r'<[^>]+>',' ',m.group(2))
                  label=html.unescape(re.sub(r'\s+',' ',label)).strip()
                  if label or any(k in href.lower() for k in ["product","free","option","etf"]):
                      print("ANCHOR",label[:180],"->",href)
              for m in re.finditer(r'(?:url|route|action)\s*[:=]\s*["\']([^"\']+)["\']',t,re.I):
                  x=html.unescape(m.group(1))
                  if any(k in x.lower() for k in ["product","category","free","api","index.php"]):
                      print("SCRIPT_URL",urljoin(r.url,x))
              for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',t,re.I):
                  print("SCRIPT",urljoin(r.url,html.unescape(m.group(1))))
