name: Analyze public RQData-derived ETF option 5m coverage
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pandas pyarrow requests
      - name: Download and inspect public parquet files
        shell: python
        run: |
          import io,requests,pandas as pd,pyarrow.parquet as pq
          base="https://raw.githubusercontent.com/Uwater1/option-longterm/main/data/"
          files=[
            "50ETF_historical_prices_5m.parquet",
            "300ETF_historical_prices_5m.parquet",
            "500ETF_historical_prices_5m.parquet",
            "588000ETF_historical_prices_5m.parquet",
            "159915ETF_historical_prices_5m.parquet",
          ]
          for fn in files:
              print("\n###",fn)
              b=requests.get(base+fn,timeout=180).content
              print("BYTES",len(b))
              pf=pq.ParquetFile(io.BytesIO(b))
              print("ROWS_META",pf.metadata.num_rows,"ROWGROUPS",pf.metadata.num_row_groups)
              cols=pf.schema.names
              print("COLS",cols)
              want=[c for c in ["order_book_id","datetime","trading_date","date"] if c in cols]
              df=pd.read_parquet(io.BytesIO(b),columns=want)
              print("SHAPE",df.shape)
              if "order_book_id" in df:
                  print("CONTRACTS",df["order_book_id"].astype(str).nunique())
              tcol="datetime" if "datetime" in df else ("trading_date" if "trading_date" in df else ("date" if "date" in df else None))
              if tcol:
                  x=pd.to_datetime(df[tcol],errors="coerce")
                  print("MIN",x.min(),"MAX",x.max(),"DAYS",x.dt.date.nunique())
              if "order_book_id" in df and tcol:
                  g=df.assign(_t=x).groupby(df["order_book_id"].astype(str))["_t"].agg(["min","max","count"])
                  print("SAMPLE_CONTRACTS")
                  print(g.sort_values("min").head(3).to_string())
                  print(g.sort_values("max").tail(3).to_string())
