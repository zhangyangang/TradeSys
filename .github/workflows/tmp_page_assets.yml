name: Inspect page assets
on:
  push:
    branches:
      - "tmp/fetch-etf-option-2025"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import requests
          s=requests.get('https://cmes-data.com/js/download.js?v=20260929',headers={'User-Agent':'Mozilla/5.0'},timeout=20).text
          lines=s.splitlines()
          for a,b in [(6450,6665),(2650,3750)]:
              print(f'===== LINES {a}-{b} =====')
              for i in range(a-1,min(b,len(lines))):
                  line=lines[i]
                  if a==6450 or ('期权' in line or 'option' in line.lower() or 'data_menu' in line):
                      print(f'{i+1}: {line}')
          PY
