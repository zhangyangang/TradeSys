name: Inspect page assets
on:
  push:
    branches:
      - "tmp/fetch-etf-option-2025"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import requests
          s=requests.get('https://cmes-data.com/js/api-single.js?v=20260918d',headers={'User-Agent':'Mozilla/5.0'},timeout=20).text
          lines=s.splitlines()
          for i,line in enumerate(lines):
              if any(k in line.lower() for k in ['trial','token','permission','expire','auth/','api/']):
                  print(f'{i+1}: {line}')
          PY
