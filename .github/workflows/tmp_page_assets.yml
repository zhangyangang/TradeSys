name: Inspect page assets
on:
  push:
    branches:
      - "tmp/fetch-etf-option-2025"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import requests,re
          t=requests.get('https://cmes-data.com/api.html',headers={'User-Agent':'Mozilla/5.0'},timeout=20).text
          a=re.findall(r'<script[^>]+src="([^"]+)"',t,re.I)
          b=re.findall(r"<script[^>]+src='([^']+)'",t,re.I)
          print('SCRIPTS',a+b)
          PY
