name: Inspect page assets
on:
  push:
    branches:
      - "tmp/fetch-etf-option-2025"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import requests
          for p in ['config.js?v=20260815','js/common.js?v=20260818','js/profile.js?v=20260815']:
              u='https://cmes-data.com/'+p
              s=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=20).text
              print('===== '+p+' =====')
              print(s)
          PY
