name: Inspect page assets
on:
  push:
    branches:
      - "tmp/fetch-etf-option-2025"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import requests,re
          for page in ['api.html']:
              t=requests.get('https://cmes-data.com/'+page,headers={'User-Agent':'Mozilla/5.0'},timeout=20).text
              print('PAGE',page,'LEN',len(t))
              print('SCRIPTS',re.findall(r'<script[^>]+src=["\\']([^"\\']+)',t,re.I))
          PY
