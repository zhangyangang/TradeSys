name: Inspect public China option datasets
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pandas openpyxl
      - name: Inspect public CSV files
        shell: python
        run: |
          import requests, io, pandas as pd, re, os
          files=[
            ("Heston_full","https://raw.githubusercontent.com/InsaneHe/Heston_Model/main/%E4%B8%8A%E8%AF%8150ETF%E6%9C%9F%E6%9D%83%E6%95%B0%E6%8D%AE.csv"),
            ("Heston_small","https://raw.githubusercontent.com/InsaneHe/Heston_Model/main/%E4%B8%8A%E8%AF%8150ETF%E6%9C%9F%E6%9D%83%E6%95%B0%E6%8D%AE1.csv"),
            ("iVIX_clean_option","https://raw.githubusercontent.com/A-cyan/iVIX/main/clean_data/data_Option.csv"),
            ("iVIX_raw_table","https://raw.githubusercontent.com/A-cyan/iVIX/main/Option_Time_Series_Data_Table.csv"),
            ("OptBT_2015","https://raw.githubusercontent.com/blank008/OptionBackTest/master/2015.csv"),
            ("OptBT_2018","https://raw.githubusercontent.com/blank008/OptionBackTest/master/2018.csv"),
          ]
          for name,url in files:
              print("\n###",name)
              r=requests.get(url,timeout=120)
              print("HTTP",r.status_code,"BYTES",len(r.content))
              if r.status_code!=200: continue
              df=None
              for enc in ["utf-8-sig","utf-8","gb18030","gbk"]:
                  try:
                      df=pd.read_csv(io.BytesIO(r.content),encoding=enc,low_memory=False)
                      print("ENC",enc); break
                  except Exception as e:
                      last=e
              if df is None:
                  print("READ_ERR",repr(last)); continue
              print("SHAPE",df.shape)
              print("COLS",list(map(str,df.columns)))
              print("HEAD")
              print(df.head(3).to_string(index=False)[:5000])
              print("TAIL")
              print(df.tail(3).to_string(index=False)[:5000])
              # summarize date-like columns
              for c in df.columns:
                  cl=str(c).lower()
                  if any(k in cl for k in ["date","time","日期","时间","交易日"]):
                      s=df[c]
                      try:
                          x=pd.to_datetime(s,errors="coerce")
                          ok=x.notna().sum()
                          if ok:
                              print("DATECOL",c,"PARSED",ok,"MIN",x.min(),"MAX",x.max(),"UNIQUE",x.nunique())
                      except Exception: pass
              for cand in ["code","option_code","id","合约编码","symbol","wind_code","sec_code"]:
                  if cand in df.columns:
                      print("UNIQUE_ID",cand,df[cand].astype(str).nunique())
