name: Probe cheap full ETF option 1m listing samples
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect listing HTML around option package
        shell: python
        run: |
          import requests,re,html
          from urllib.parse import urljoin
          u="https://tushare.indevs.in/quant/trading-data/"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=40)
          print("HTTP",r.status_code,"LEN",len(r.text),"FINAL",r.url)
          t=r.text
          needles=["19,636","A股ETF期权历史1分钟","RQData A股ETF期权历史1分钟","真实分钟数据样例"]
          for needle in needles:
              i=t.find(needle)
              print("\nNEEDLE",needle,"IDX",i)
              if i>=0:
                  sn=t[max(0,i-8000):i+12000]
                  # all href/src and plaintext URLs near section
                  for m in re.finditer(r'(?:href|src)=["\']([^"\']+)["\']',sn,re.I):
                      x=urljoin(r.url,html.unescape(m.group(1)))
                      print("LINK",x)
                  for x in re.findall(r'https?://[^\s<>"\']+',sn):
                      print("PLAINURL",html.unescape(x.rstrip(").,;")))
                  plain=html.unescape(re.sub(r'<[^>]+>',' ',sn))
                  print("TEXT",re.sub(r'\s+',' ',plain)[:12000])
