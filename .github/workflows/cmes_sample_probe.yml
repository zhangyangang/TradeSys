name: Probe several expired ETF option contracts
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Sina five-day minute history
        shell: python
        run: |
          import requests, json, statistics
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://finance.sina.com.cn/"})
          u="https://stock.finance.sina.com.cn/futures/api/openapi.php/StockOptionDaylineService.getFiveDayLine"
          codes=["10001313","10001979","10009633","10010155","10010156"]
          for code in codes:
              r=s.get(u,params={"symbol":"CON_OP_"+code},timeout=30)
              print("\nCODE",code,"HTTP",r.status_code,"LEN",len(r.text))
              try:
                  j=r.json()
                  days=(j.get("result") or {}).get("data")
                  if not isinstance(days,list):
                      print("NO_DATA",str(days)[:500]); continue
                  summary=[]
                  total=0
                  for di,day in enumerate(days):
                      if not isinstance(day,list):
                          continue
                      total+=len(day)
                      d=next((x.get("d") for x in day if isinstance(x,dict) and x.get("d")),None)
                      first=day[0].get("i") if day and isinstance(day[0],dict) else None
                      last=day[-1].get("i") if day and isinstance(day[-1],dict) else None
                      summary.append((d,len(day),first,last))
                  print("DAYS",summary)
                  print("TOTAL_BARS",total)
                  if days and isinstance(days[0],list) and days[0]:
                      print("FIRST_ROW",days[0][0])
                  if days and isinstance(days[-1],list) and days[-1]:
                      print("LAST_ROW",days[-1][-1])
              except Exception as e:
                  print("PARSE_ERR",type(e).__name__,str(e)[:500],"HEAD",r.text[:1000])
