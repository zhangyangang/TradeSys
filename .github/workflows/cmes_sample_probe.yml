name: Inspect CMES batch protocol
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current cmesdata HTTP protocol
        shell: bash
        run: |
          python -m pip download --no-deps cmesdata==1.2.46 -d /tmp >/dev/null
          python - <<'PY'
          import glob,zipfile
          whl=glob.glob('/tmp/cmesdata-*.whl')[0]
          z=zipfile.ZipFile(whl)
          for fn in ['cmesdata/historydata.py','cmesdata/stock.py']:
              s=z.read(fn).decode('utf-8','ignore')
              lines=s.splitlines()
              print('===== '+fn+' =====')
              for key in ['def _fetch_symbol_list','def _download_file','def _require_token','def login']:
                  for i,line in enumerate(lines):
                      if line.startswith(key):
                          print('--- '+key+' ---')
                          print('\n'.join(lines[i:i+100]))
                          break
          PY
