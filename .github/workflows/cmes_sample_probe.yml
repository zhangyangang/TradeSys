name: Inspect public ETF option tick samples
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests pandas
      - name: Download and inspect ZIP samples
        shell: python
        run: |
          import requests, zipfile, io, os, csv, pandas as pd, re, collections
          urls=[
            ("300ETF_TICK","https://www.caifushuju.cn/sample/300ETFQIUAN-TICK.zip"),
            ("50ETF_TICK","https://www.caifushuju.cn/sample/50qiquan-rixian-5tick.zip"),
            ("50ETF_5MIN","https://www.caifushuju.cn/sample/50qiquan-rixian-5min.csv.zip"),
          ]
          for name,url in urls:
              print("\n###",name,url)
              r=requests.get(url,timeout=120)
              print("HTTP",r.status_code,"BYTES",len(r.content),"FINAL",r.url)
              if r.status_code!=200 or not r.content.startswith(b"PK"):
                  print("HEAD",repr(r.content[:300])); continue
              z=zipfile.ZipFile(io.BytesIO(r.content))
              files=[x for x in z.namelist() if not x.endswith("/")]
              print("FILES",len(files))
              print("NAMES_HEAD",files[:20])
              print("NAMES_TAIL",files[-10:])
              total_lines=0; dates=set(); contracts=set(); headers=collections.Counter()
              samples=0
              for fn in files:
                  b=z.read(fn)
                  txt=None; enc_used=None
                  for enc in ("utf-8-sig","gb18030","gbk","utf-8"):
                      try: txt=b.decode(enc); enc_used=enc; break
                      except: pass
                  if txt is None: continue
                  lines=txt.splitlines()
                  total_lines += max(0,len(lines)-1)
                  if lines:
                      headers[lines[0]] += 1
                  # scan date/timestamps and contract code filename/content
                  m=re.search(r'(?:OP)?(\d{8})',fn)
                  if m: contracts.add(m.group(1))
                  for line in lines[1:]:
                      # yyyy-mm-dd or yyyy/mm/dd
                      mm=re.search(r'(20\d{2}[-/]\d{1,2}[-/]\d{1,2})',line)
                      if mm: dates.add(mm.group(1).replace("/","-"))
                  if samples<3:
                      print("FILE_SAMPLE",fn,"ENC",enc_used,"LINES",len(lines))
                      print("FIRST3",lines[:3])
                      print("LAST2",lines[-2:])
                      samples+=1
              print("TOTAL_DATA_LINES",total_lines)
              print("CONTRACTS",len(contracts),sorted(contracts)[:10],sorted(contracts)[-10:])
              print("DATES",len(dates),sorted(dates)[:10],sorted(dates)[-10:])
              print("HEADERS",headers.most_common(5))
