name: Probe BigQuant option 1m guest access
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BigQuant SDK
        run: |
          python -m pip install -q --extra-index-url https://pypi.bigquant.com/simple/ bigquant pandas pyarrow || python -m pip install -q -i https://pypi.bigquant.com/simple/ bigquant pandas pyarrow
      - name: Probe guest query
        shell: python
        run: |
          import traceback,sys
          try:
              import bigquant
              print("BIGQUANT",getattr(bigquant,"__version__",None),dir(bigquant)[:80])
          except Exception as e:
              print("IMPORT_ERR",type(e).__name__,str(e))
              raise
          try:
              print("WHOAMI",bigquant.whoami())
          except Exception as e:
              print("WHOAMI_ERR",type(e).__name__,str(e)[:1000])
          try:
              from bigquant import dai
          except Exception:
              try:
                  from bigquant.api import dai
              except Exception as e:
                  print("DAI_IMPORT_ERR",type(e).__name__,str(e)); raise
          queries=[
              ("schema","select * from cn_option_bar1m limit 1",True,{}),
              ("contract","select date,instrument,open,high,low,close,volume,amount,open_interest from cn_option_bar1m where instrument like '10010156%' and date >= '2025-09-29' and date <= '2025-11-26' order by date limit 20",False,{"date":["2025-09-29","2025-11-26"]}),
          ]
          for name,sql,full,filters in queries:
              try:
                  r=dai.query(sql,full_db_scan=full,filters=filters)
                  df=r.df()
                  print("QUERY_OK",name,df.shape)
                  print(df.head(20).to_string())
              except Exception as e:
                  print("QUERY_ERR",name,type(e).__name__,str(e)[:3000])
