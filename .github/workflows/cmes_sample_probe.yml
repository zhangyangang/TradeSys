name: Probe Sina five-day hidden window params
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe count-like params
        shell: python
        run: |
          import requests,json,hashlib,itertools
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://stock.finance.sina.com.cn/"})
          u="https://stock.finance.sina.com.cn/futures/api/openapi.php/StockOptionDaylineService.getFiveDayLine"
          base={"symbol":"CON_OP_10010156"}
          cases=[{}]
          for k in ["days","day","ndays","num","count","datalen","limit","length","size","pageSize"]:
              for v in ["10","20","30","60","100"]:
                  cases.append({k:v})
          for k,v in [("type","10"),("type","20"),("period","10"),("period","20")]:
              cases.append({k:v})
          seen={}
          for i,extra in enumerate(cases):
              p=base.copy(); p.update(extra)
              try:
                  r=s.get(u,params=p,timeout=20)
                  j=r.json()
                  days=(j.get("result") or {}).get("data")
                  if not isinstance(days,list):
                      print("CASE",i,extra,"NO_LIST",str(days)[:100]); continue
                  dates=[]
                  total=0
                  for day in days:
                      if isinstance(day,list):
                          total+=len(day)
                          d=next((x.get("d") for x in day if isinstance(x,dict) and x.get("d")),None)
                          dates.append(d)
                  sig=(len(days),total,tuple(dates))
                  if sig not in seen:
                      seen[sig]=extra
                      print("UNIQUE",extra,"NDAYS",len(days),"TOTAL",total,"DATES",dates,"LEN",len(r.content))
              except Exception as e:
                  print("ERR",extra,type(e).__name__,str(e)[:160])
          print("UNIQUE_SIGNATURES",len(seen))
