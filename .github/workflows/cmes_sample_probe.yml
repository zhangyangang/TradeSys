name: Probe earliest SZSE ETF option codes on Sina
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query early Shenzhen ETF option codes
        shell: python
        run: |
          import requests
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://finance.sina.com.cn/"})
          u="https://stock.finance.sina.com.cn/futures/api/openapi.php/StockOptionDaylineService.getFiveDayLine"
          for code in ["90000001","90000002","90000010","90000291"]:
              r=s.get(u,params={"symbol":"CON_OP_"+code},timeout=30)
              try:
                  j=r.json()
                  days=(j.get("result") or {}).get("data")
                  summary=[]
                  total=0
                  if isinstance(days,list):
                      for day in days:
                          if not isinstance(day,list): continue
                          total+=len(day)
                          d=next((x.get("d") for x in day if isinstance(x,dict) and x.get("d")),None)
                          summary.append((d,len(day)))
                  print(code,"HTTP",r.status_code,"LEN",len(r.text),"DAYS",summary,"TOTAL",total)
              except Exception as e:
                  print(code,"ERR",repr(e),"HEAD",r.text[:300])
