name: Fetch CMES option sample data
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and extract real 1-minute option sample
        shell: python
        run: |
          import requests, os, base64, io, zipfile, csv, json
          from pathlib import Path
          out=Path("out"); out.mkdir(exist_ok=True)
          params={
              "data_menu":"国内期权|一分钟级别|一分钟级别",
              "down_type":"单只获取",
              "code":"10010156"
          }
          r=requests.get(
              "https://cmes-data.com/api/sample",
              params=params,
              headers={"User-Agent":"Mozilla/5.0","Referer":"https://cmes-data.com/download.html"},
              timeout=30
          )
          print("HTTP",r.status_code)
          r.raise_for_status()
          j=r.json()
          print("SUCCESS",j.get("success"))
          d=j["data"]
          meta={k:v for k,v in d.items() if k!="zip_data"}
          print("META",json.dumps(meta,ensure_ascii=False))
          zbytes=base64.b64decode(d["zip_data"])
          (out/"10010156_sample.zip").write_bytes(zbytes)
          with zipfile.ZipFile(io.BytesIO(zbytes)) as z:
              print("ZIP NAMES",z.namelist())
              for name in z.namelist():
                  raw=z.read(name)
                  (out/name).write_bytes(raw)
                  text=None
                  for enc in ("utf-8-sig","gb18030","utf-8"):
                      try:
                          text=raw.decode(enc)
                          print("ENC",enc)
                          break
                      except UnicodeDecodeError:
                          pass
                  if text is not None:
                      lines=text.splitlines()
                      print("CSV ROWS INCLUDING HEADER",len(lines))
                      print("HEAD")
                      print("\n".join(lines[:12]))
                      print("TAIL")
                      print("\n".join(lines[-12:]))
          (out/"metadata.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")
      - uses: actions/upload-artifact@v4
        with:
          name: cmes-10010156-real-1min-sample
          path: out/
          retention-days: 1
