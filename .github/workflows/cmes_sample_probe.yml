name: Probe TDX option 1m anonymous access
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tdxaidata
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q tdxaidata -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Test option historical minute access without key
        shell: python
        run: |
          import os, json, traceback, sys
          print("PY",sys.version)
          try:
              import tdxaidata
              print("TDXAIDATA",getattr(tdxaidata,"__version__",None),tdxaidata)
              from tdxaidata import tqs
          except Exception as e:
              print("IMPORT_ERR",type(e).__name__,str(e))
              raise
          tests=[
              ("10010156.SH","1m","2025-11-20","2025-11-26"),
              ("10001313.SH","1m","2018-12-20","2018-12-26"),
              ("90005168.SZ","1m","2025-04-17","2025-04-23"),
              ("510500.SH","1m","2025-11-20","2025-11-26"),
          ]
          for code,period,start,end in tests:
              print("\nTEST",code,period,start,end)
              try:
                  r=tqs.get_market_data(
                      field_list=["Open","High","Low","Close","Volume","Amount"],
                      stock_list=[code],
                      period=period,
                      start_time=start,
                      end_time=end,
                  )
                  print("TYPE",type(r).__name__)
                  s=str(r)
                  print("RESULT",s[:5000])
              except Exception as e:
                  print("ERR",type(e).__name__,str(e)[:3000])
                  traceback.print_exc(limit=2)
