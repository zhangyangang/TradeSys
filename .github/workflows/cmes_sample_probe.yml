name: Probe Sina ETF option minute archives
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Sina 5-day and intraday option endpoints
        shell: python
        run: |
          import requests, json, os
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://finance.sina.com.cn/"})
          eps={
            "5day":"https://stock.finance.sina.com.cn/futures/api/openapi.php/StockOptionDaylineService.getFiveDayLine",
            "minute":"https://stock.finance.sina.com.cn/futures/api/openapi.php/StockOptionDaylineService.getOptionMinline",
          }
          codes=["10010156","10009633"]
          for code in codes:
              sym="CON_OP_"+code
              for name,u in eps.items():
                  try:
                      r=s.get(u,params={"symbol":sym},timeout=30)
                      print("TEST",code,name,"STATUS",r.status_code,"LEN",len(r.text))
                      print("HEAD",r.text[:2500].replace("\n"," "))
                      if "2025-" in r.text or "2026-" in r.text:
                          print("HAS_DATE",code,name)
                  except Exception as e:
                      print("ERR",code,name,repr(e))
