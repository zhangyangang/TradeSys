name: Probe anonymous RQData option 1m
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rqdatac
        run: python -m pip install -q rqdatac pandas
      - name: Probe anonymous init and ETF option minute bars
        shell: python
        run: |
          import rqdatac as rq, traceback, pandas as pd, os
          print("VERSION",getattr(rq,"__version__",None))
          try:
              x=rq.init()
              print("INIT_OK",repr(x))
          except Exception as e:
              print("INIT_ERR",type(e).__name__,str(e)[:2000])
              traceback.print_exc(limit=2)
          tests=[
            ("10001313","2018-12-20","2018-12-20"),
            ("10010156","2025-10-23","2025-10-23"),
            ("510050.XSHG","2025-10-23","2025-10-23"),
          ]
          for code,start,end in tests:
              print("\nTEST",code)
              try:
                  df=rq.get_price(code,start_date=start,end_date=end,frequency="1m")
                  print("TYPE",type(df).__name__)
                  if df is None:
                      print("NONE")
                  else:
                      print("SHAPE",getattr(df,"shape",None))
                      print(df.head(5).to_string())
                      print(df.tail(5).to_string())
              except Exception as e:
                  print("ERR",type(e).__name__,str(e)[:3000])
                  traceback.print_exc(limit=2)
