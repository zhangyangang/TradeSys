name: Probe public ETF option sample CSVs
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public sample files
        shell: python
        run: |
          import requests, csv, io, re, json
          urls=[
            "https://od.lk/d/NTNfMTE2NDQ2NTZf/50O1minlx.csv",
            "https://od.lk/d/NTNfMTE2NDQ2NTJf/50O1minir.csv",
            "https://od.lk/d/NTNfMTE2NDQ2NTVf/50O1minivs.csv",
            "https://od.lk/d/NTNfMTE2NDQ2NTNf/50O1miniv.csv",
            "https://od.lk/d/NTNfMTE2NDQ2NTRf/50O1minivf.csv",
            "https://od.lk/d/NTNfMTM1MTUzMjFf/o50iv1minrp.csv",
            "https://od.lk/d/NTNfMTM1MTUzMjBf/o50iv1minsi.csv",
            "https://od.lk/d/NTNfMTMxNDg2MTBf/sim1min50.csv",
            "http://caifushuju.cn/sample/50qiquan-rixian-1min.csv",
            "https://caifushuju.cn/sample/50qiquan-rixian-1min.csv",
          ]
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0"})
          for u in urls:
              print("\nURL",u)
              try:
                  r=s.get(u,timeout=30,allow_redirects=True)
                  print("STATUS",r.status_code,"FINAL",r.url,"LEN",len(r.content),"CTYPE",r.headers.get("content-type"))
                  head=r.content[:2000]
                  try:
                      txt=head.decode("utf-8-sig")
                  except:
                      try: txt=head.decode("gb18030")
                      except: txt=repr(head)
                  print("HEAD",repr(txt[:1000]))
                  if r.status_code==200 and len(r.content)>100:
                      data=r.content
                      # estimate rows for text
                      for enc in ("utf-8-sig","gb18030","utf-8"):
                          try:
                              t=data.decode(enc)
                              lines=t.splitlines()
                              print("ENC",enc,"LINES",len(lines),"FIRST3",lines[:3],"LAST2",lines[-2:])
                              break
                          except Exception:
                              pass
              except Exception as e:
                  print("ERR",type(e).__name__,str(e)[:500])
