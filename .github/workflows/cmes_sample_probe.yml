name: Probe CMES public option sample
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact anonymous option sample request
        shell: python
        run: |
          import requests, os, re, json
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://cmes-data.com/download.html"})
          js=s.get("https://cmes-data.com/js/download.js?v=20260929",timeout=30).text
          lines=js.splitlines()
          for i,line in enumerate(lines):
              if "_GN_OPTION_CODE_LIST" in line:
                  print("CODELIST_HIT",i+1,line[:2000])
                  for j in range(max(0,i-5),min(len(lines),i+80)):
                      print(f"CODELIST {j+1}: {lines[j][:3000]}")
                  break
          base="https://cmes-data.com/api/sample"
          menu="国内期权|一分钟级别|一分钟级别"
          codes=[
              "HO2609-C-2500",
              "10010156",
              "SH.10010156",
              "510500P2511M06250",
              "510500-P-2511-6.25",
              "510500-P-2511-6250"
          ]
          os.makedirs("out",exist_ok=True)
          for n,code in enumerate(codes):
              params={"data_menu":menu,"down_type":"单只获取","code":code}
              r=s.get(base,params=params,timeout=30)
              print("CODE",code,"STATUS",r.status_code,"TYPE",r.headers.get("content-type"))
              print("BODY",r.text[:5000].replace("\n"," "))
              open(f"out/{n}_{re.sub('[^A-Za-z0-9_.-]','_',code)}.txt","w",encoding="utf-8").write("URL "+r.url+"\n"+r.text)
      - uses: actions/upload-artifact@v4
        with:
          name: cmes-exact-sample-probe
          path: out/
          retention-days: 1
