name: Probe Sina historical window params
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test date-like parameters on public five-day endpoint
        shell: python
        run: |
          import requests,json,hashlib
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://stock.finance.sina.com.cn/"})
          u="https://stock.finance.sina.com.cn/futures/api/openapi.php/StockOptionDaylineService.getFiveDayLine"
          sym="CON_OP_10010156"
          cases=[
            {},
            {"date":"2025-11-13"},
            {"date":"2025-10-31"},
            {"end_date":"2025-11-13"},
            {"endDate":"2025-11-13"},
            {"trade_date":"2025-11-13"},
            {"start_date":"2025-11-10","end_date":"2025-11-14"},
            {"from":"2025-11-10","to":"2025-11-14"},
          ]
          for i,extra in enumerate(cases):
              p={"symbol":sym}; p.update(extra)
              r=s.get(u,params=p,timeout=30)
              h=hashlib.sha256(r.content).hexdigest()[:16]
              try:
                  j=r.json(); days=(j.get("result") or {}).get("data") or []
                  dates=[]
                  for day in days:
                      if isinstance(day,list) and day:
                          d=next((x.get("d") for x in day if isinstance(x,dict) and x.get("d")),None)
                          dates.append(d)
                  print("CASE",i,extra,"STATUS",r.status_code,"HASH",h,"DATES",dates,"LEN",len(r.text))
              except Exception as e:
                  print("CASE",i,extra,"ERR",repr(e),"HASH",h,"HEAD",r.text[:300])
