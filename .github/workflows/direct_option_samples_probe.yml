name: Analyze 300ETF tick sample to 1m
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pandas requests
      - name: Analyze 300ETF tick sample
        shell: python
        run: |
          import requests,zipfile,io,pandas as pd,re
          u="https://www.caifushuju.cn/sample/300ETFQIUAN-TICK.zip"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=90)
          print("HTTP",r.status_code,"BYTES",len(r.content))
          z=zipfile.ZipFile(io.BytesIO(r.content))
          files=[x for x in z.infolist() if not x.is_dir() and x.filename.lower().endswith(".csv")]
          print("CSV_COUNT",len(files))
          for x in files:
              b=z.read(x)
              txt=b.decode("gb18030",errors="replace")
              lines=txt.splitlines()
              print("\nFILE",x.filename,"BYTES",len(b),"LINES",len(lines))
              print("HEAD",repr("\n".join(lines[:4])[:2500]))
              try:
                  df=pd.read_csv(io.StringIO(txt))
              except Exception:
                  try: df=pd.read_csv(io.StringIO(txt),skiprows=1)
                  except Exception as e:
                      print("PARSE_ERR",type(e).__name__,str(e)); continue
              print("COLS",list(df.columns))
              # detect time
              tcol=None
              for c in df.columns:
                  lc=str(c).lower()
                  if lc in ("time","datetime","date") or "时间" in str(c):
                      tcol=c; break
              if tcol:
                  dt=pd.to_datetime(df[tcol],errors="coerce")
                  print("ROWS",len(df),"MIN",dt.min(),"MAX",dt.max(),"DAYS",dt.dt.date.nunique())
              # print first/last
              print("FIRSTROW",df.head(1).to_dict("records"))
              print("LASTROW",df.tail(1).to_dict("records"))
              # Aggregate first file to 1m if possible
              if x==files[0] and tcol:
                  dfx=df.copy()
                  dfx["_dt"]=pd.to_datetime(dfx[tcol],errors="coerce")
                  # find price/vol/oi columns flexibly
                  def pick(names):
                      for c in dfx.columns:
                          lc=str(c).lower()
                          if any(n in lc for n in names): return c
                  pc=pick(["price","最新","成交价"])
                  vc=pick(["volume","成交量"])
                  oc=pick(["openint","open_interest","持仓"])
                  if pc:
                      dfx[pc]=pd.to_numeric(dfx[pc],errors="coerce")
                      agg={pc:["first","max","min","last"]}
                      if vc: agg[vc]="sum"
                      if oc: agg[oc]="last"
                      m=dfx.dropna(subset=["_dt"]).set_index("_dt").resample("1min").agg(agg).dropna(how="all")
                      print("AGG_1M_ROWS",len(m),"MIN",m.index.min(),"MAX",m.index.max())
                      print("AGG_HEAD",m.head(5).to_string())
