name: Summarize public ETF option 1m ZIP samples
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pandas requests
      - name: Summarize 1m files
        shell: python
        run: |
          import requests,zipfile,io,pandas as pd
          urls=[
            "https://www.wikitter.com/sample/stockonmin2ivlx.zip",
            "https://www.wikitter.com/sample/stockonmin2ivmid.zip",
            "https://www.wikitter.com/sample/stockonmin2ivba1.zip",
            "https://www.wikitter.com/sample/stockonmin2ivba5.zip",
          ]
          s=requests.Session(); s.headers["User-Agent"]="Mozilla/5.0"
          for u in urls:
              r=s.get(u,timeout=90)
              z=zipfile.ZipFile(io.BytesIO(r.content))
              files=[x for x in z.infolist() if "1min" in x.filename.lower() and x.filename.lower().endswith(".csv")]
              print("\nARCHIVE",u,"HTTP",r.status_code,"BYTES",len(r.content),"ONE_MIN_FILES",len(files))
              for x in files:
                  b=z.read(x)
                  txt=b.decode("utf-8-sig",errors="replace")
                  try: df=pd.read_csv(io.StringIO(txt))
                  except Exception as e:
                      print("PARSE_ERR",x.filename,type(e).__name__,str(e)); continue
                  # date+time
                  if "日期" in df and "时间" in df:
                      dt=pd.to_datetime(df["日期"].astype(str)+" "+df["时间"].astype(str),errors="coerce")
                  elif "date" in df:
                      dt=pd.to_datetime(df["date"],errors="coerce")
                  else: dt=pd.Series(pd.NaT,index=df.index)
                  ccol="合约编码" if "合约编码" in df else ("code" if "code" in df else None)
                  print("FILE",x.filename,"ROWS",len(df),"COLS",len(df.columns),"MIN",dt.min(),"MAX",dt.max(),"DAYS",dt.dt.date.nunique(),"CONTRACTS",df[ccol].astype(str).nunique() if ccol else None)
                  if ccol: print("CODES",df[ccol].astype(str).drop_duplicates().tolist()[:20])
                  print("FIELDS",list(df.columns))
