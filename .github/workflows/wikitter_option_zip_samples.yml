name: Inspect public ETF option 1m ZIP samples
on:
  push:
    branches:
      - "tmp/cmes-sample-probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests
      - name: Download inspect ZIPs
        shell: python
        run: |
          import requests,zipfile,io,hashlib,csv,re
          urls=[
            "https://www.wikitter.com/sample/stockonmin2ivlx.zip",
            "https://www.wikitter.com/sample/stockonmin2ivmid.zip",
            "https://www.wikitter.com/sample/stockonmin2ivba1.zip",
            "https://www.wikitter.com/sample/stockonmin2ivba5.zip",
          ]
          s=requests.Session(); s.headers["User-Agent"]="Mozilla/5.0"
          for u in urls:
              print("\n### URL",u)
              r=s.get(u,timeout=90)
              print("HTTP",r.status_code,"LEN",len(r.content),"TYPE",r.headers.get("content-type"),"SHA",hashlib.sha256(r.content).hexdigest()[:16])
              try:
                  z=zipfile.ZipFile(io.BytesIO(r.content))
              except Exception as e:
                  print("ZIP_ERR",type(e).__name__,str(e)); continue
              infos=[x for x in z.infolist() if not x.is_dir()]
              print("FILES",len(infos),"TOTAL_UNCOMP",sum(x.file_size for x in infos))
              for x in infos[:100]:
                  print("FILE",x.filename,x.file_size)
              # inspect first up to 10 csv/text files
              for x in infos[:10]:
                  b=z.read(x)
                  print("\nDATAFILE",x.filename,"SIZE",len(b))
                  t=None
                  for enc in ("utf-8-sig","gb18030","utf-16","latin1"):
                      try:
                          t=b[:8000].decode(enc); used=enc; break
                      except: pass
                  if t is not None:
                      print("ENC",used)
                      print("HEAD",repr(t[:2500]))
