name: Temporary ETF option public sample fetch

on:
  push:
    branches:
      - "tmp/fetch-etf-option-2025"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public option CSV samples and extract 2025
        shell: python
        run: |
          import os, urllib.request, csv, re, gzip, shutil
          os.makedirs("out2", exist_ok=True)
          urls = [
            ("50O1minlx.csv","https://od.lk/d/NTNfMTE2NDQ2NTZf/50O1minlx.csv"),
            ("50O1minivf.csv","https://od.lk/d/NTNfMTE2NDQ2NTRf/50O1minivf.csv"),
            ("50o1minlxatm.csv","https://od.lk/d/NTNfMTE3NDU4MDhf/50o1minlxatm.csv"),
          ]
          for name,url in urls:
              print("FETCH",url)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      print("STATUS",r.status,"TYPE",r.headers.get("content-type"),"LEN",r.headers.get("content-length"),"FINAL",r.geturl())
                      data=r.read()
                  print("BYTES",len(data),"HEAD",repr(data[:200]))
                  open("out2/"+name,"wb").write(data)
                  # decode likely UTF-8/GBK and inspect
                  text=None
                  for enc in ("utf-8-sig","gb18030","utf-8"):
                      try:
                          text=data.decode(enc); print("ENC",enc); break
                      except: pass
                  if text:
                      lines=text.splitlines()
                      print("LINES",len(lines),"FIRST",lines[:3],"LAST",lines[-3:])
                      hits=[ln for ln in lines if "2025-" in ln or "2025/" in ln or re.search(r"(^|,)2025\d{4}",ln)]
                      print("2025 HITS",len(hits))
                      if hits:
                          open("out2/"+name.replace(".csv","_2025.csv"),"w",encoding="utf-8-sig").write(lines[0]+"\n"+"\n".join(hits)+"\n")
                          print("2025 FIRST",hits[:3],"2025 LAST",hits[-3:])
              except Exception as e:
                  print("ERROR",name,repr(e))
      - name: Show output
        run: |
          ls -lh out2 || true
          for f in out2/*2025.csv; do echo "=== $f ==="; head -5 "$f"; tail -5 "$f"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: etf-option-public-samples
          path: out2/
          retention-days: 1
